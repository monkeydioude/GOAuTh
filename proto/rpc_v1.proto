syntax = "proto3";

package v1;

import "google/protobuf/timestamp.proto";

option go_package = "pkg/grpc/v1";

message UserRequest {
    string login = 1;
    string password = 2;
    string realm = 3;
    optional int64 access_expires_in_seconds = 4;
    // ignored: a refresh token lives as long as its session (SESSION_TTL_DAYS)
    optional int64 refresh_expires_in_seconds = 5 [deprecated = true];
    ClientInfo client = 6;
}

message AuthIdRequest {
    int32 uid = 1;
    string reason = 2;
    // who asked for it, as the consumer names them; required for a service account
    optional string actor = 3;
}

// Logout ends the session of the access token in the Authorization metadata, or
// of refresh_token. Without either, it ends all of uid's sessions in realm (deprecated).
message LogoutRequest {
    int32 uid = 1;
    string realm = 2;
    string refresh_token = 3;
}

service Auth {
    rpc Signup(UserRequest) returns (Response) {}
    rpc Login(UserRequest) returns (Response) {}
    rpc Delete(AuthIdRequest) returns (Response) {}
    rpc Logout(LogoutRequest) returns (Response) {}
}

message StatusIn {
    string accessToken = 1;
    string refreshToken = 2;
}

message StatusOut {
    bool accessTokenValid = 1;
    bool refreshTokenValid = 2;
}

message RefreshIn {
    string refreshToken = 1;
    optional int64 access_expires_in_seconds = 2;
    // ignored: a refresh token lives as long as its session (SESSION_TTL_DAYS)
    optional int64 refresh_expires_in_seconds = 3 [deprecated = true];
    ClientInfo client = 4;
}

// refreshToken is empty when a parallel refresh already rotated the token
// (within SESSION_REUSE_GRACE_SECONDS): keep the refresh token that one returned.
message RefreshOut {
    string accessToken = 1;
    int64 access_expires_at = 2;
    string refreshToken = 3;
    int64 refresh_expires_at = 4;
}

service JWT {
    rpc Status(StatusIn) returns (StatusOut) {}
    rpc Refresh(RefreshIn) returns (RefreshOut) {}
}

message EditUserRequest {
    string new_login = 1;
    string new_password = 2;
    string password = 3;
}

service User {
    rpc Deactivate(Empty) returns (Response) {}
    rpc EditUser(EditUserRequest) returns (Response) {}
}

message UserActionRequest {
    string login = 1;
    string realm = 2;
    string action = 3;
    string data = 4;
}

message UserActionValidation {
    string login = 1;
    string realm = 2;
    string data = 3;
    string against = 4;
    bool self_contained_code = 5;
}

message UserActionStatus {
    string login = 1;
    string realm = 2;
    string action = 3;
    string data = 4;
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp updated_at = 6;
    google.protobuf.Timestamp validated_at = 7;
}

message UserActionStatusResponse {
    int32 code = 1;
    string message = 2;
    repeated UserActionStatus statuses = 3;
}

service UserAction {
    rpc Create(UserActionRequest) returns (Response) {}
    rpc Validate(UserActionValidation) returns (Response) {}
    rpc Status(UserActionRequest) returns (UserActionStatusResponse) {}
}

message Response {
    int32 code = 1;
    string message = 2;
    string identifier = 3;
}

message Empty {}

// ClientInfo is the end user's client, sent by the backend calling goauth on their behalf.
message ClientInfo {
    string ip = 1;
    string user_agent = 2;
}

// SessionInfo is one session of the user: a login on a device, kept alive by refreshes.
message SessionInfo {
    string id = 1;
    string user_agent = 2;
    string login_ip = 3;
    string last_ip = 4;
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp last_connection = 6;
    google.protobuf.Timestamp expires_at = 7;
    // unset while the session is not revoked
    google.protobuf.Timestamp revoked_at = 8;
    string revoked_reason = 9;
    // the session of the access token the call was made with
    bool current = 10;
}

message ListSessionsRequest {
    // also list revoked and expired sessions
    bool include_revoked = 1;
}

message ListSessionsResponse {
    int32 code = 1;
    string message = 2;
    repeated SessionInfo sessions = 3;
}

message RevokeSessionRequest {
    string session_id = 1;
}

message RevokeAllSessionsRequest {
    // keep the session of the access token the call was made with
    bool keep_current = 1;
}

// Session calls act on the sessions of the user whose access token is in the
// Authorization metadata.
service Session {
    rpc List(ListSessionsRequest) returns (ListSessionsResponse) {}
    rpc Revoke(RevokeSessionRequest) returns (Response) {}
    rpc RevokeAll(RevokeAllSessionsRequest) returns (Response) {}
}

// Account is what a trusted backend manages in a service realm. People sign up
// through Auth instead.
message CreateAccountRequest {
    string realm = 1;
    // a slug: lowercase letters, digits and :._- (1 to 128 characters), never an email
    string login = 2;
    // who asked for it, as the consumer names them; required
    string actor = 3;
}

message CreateAccountResponse {
    int32 code = 1;
    string message = 2;
    int32 account_id = 3;
    string login = 4;
    string realm = 5;
    string realm_kind = 6;
    google.protobuf.Timestamp created_at = 7;
}

service Account {
    // Create makes an account in realm: 201, or 404 for an unknown realm, 403 for
    // a realm whose kind has no such accounts, 422 for a bad login or actor, 409
    // for a login the realm already has.
    rpc Create(CreateAccountRequest) returns (CreateAccountResponse) {}
}
